{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5 col-md-7">
    <div class="card shadow-sm border-0 mt-4 position-relative overflow-hidden">
      <div id="loginBusyOverlay"
           class="d-none position-absolute top-0 start-0 w-100 h-100 align-items-center justify-content-center"
           style="z-index: 20; background: rgba(248, 249, 250, 0.90);"
           aria-live="polite" aria-label="Signing in">
        <div class="text-center px-4">
          <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
          <div class="fw-semibold mt-3">Signing in...</div>
          <div class="small text-muted mt-1">Authenticating, please wait.</div>
        </div>
      </div>

      <div class="card-body p-4">
        <h3 class="mb-2">Local Manager Login</h3>
        <p class="text-muted mb-4">Break-glass DHCP Manager access. This login is independent of Active Directory/VAS.</p>

        <form id="localManagerLoginForm" method="POST">
          <div class="mb-3">
            <label class="form-label">Manager username</label>
            <input id="localManagerUsername" name="username" class="form-control" placeholder="{{ manager_username }}" autocomplete="username" autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="localManagerPassword" name="password" type="password" class="form-control" autocomplete="current-password">
          </div>
          <button id="localManagerLoginButton" type="submit" class="btn btn-primary w-100">Local Manager Login</button>
        </form>

        <div class="mt-3 text-center">
          <a id="backToAdLogin" href="{{ url_for('login') }}" class="btn btn-link">← Back to AD Login</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const form = document.getElementById("localManagerLoginForm");
  const usernameInput = document.getElementById("localManagerUsername");
  const passwordInput = document.getElementById("localManagerPassword");
  const loginButton = document.getElementById("localManagerLoginButton");
  const backLink = document.getElementById("backToAdLogin");
  const busyOverlay = document.getElementById("loginBusyOverlay");
  let submitInProgress = false;

  form.addEventListener("submit", (event) => {
    if (submitInProgress) {
      event.preventDefault();
      return;
    }

    submitInProgress = true;
    form.setAttribute("aria-busy", "true");
    usernameInput.readOnly = true;
    passwordInput.readOnly = true;
    loginButton.disabled = true;
    loginButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Signing in...';
    backLink.classList.add("disabled");
    backLink.setAttribute("aria-disabled", "true");
    backLink.setAttribute("tabindex", "-1");
    busyOverlay.classList.remove("d-none");
    busyOverlay.classList.add("d-flex");
  });
})();
</script>
{% endblock %}
